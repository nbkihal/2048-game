<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Board background (classic 2048 tan) -->
  <rect x="0" y="0" width="512" height="512" rx="100" fill="#bbada0"/>

  <!-- Empty-cell shading behind tiles (subtle depth) -->
  <g fill="#cdc1b4">
    <rect x="56"  y="56"  width="188" height="188" rx="16"/>
    <rect x="268" y="56"  width="188" height="188" rx="16"/>
    <rect x="56"  y="268" width="188" height="188" rx="16"/>
    <rect x="268" y="268" width="188" height="188" rx="16"/>
  </g>

  <!-- Tiles: 2 0 / 4 8 -->
  <!-- "2" -->
  <rect x="56"  y="56"  width="188" height="188" rx="16" fill="#eee4da"/>
  <text x="150" y="150" text-anchor="middle" dominant-baseline="central"
        font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="128" fill="#776e65">2</text>

  <!-- "0" -->
  <rect x="268" y="56"  width="188" height="188" rx="16" fill="#f2b179"/>
  <text x="362" y="150" text-anchor="middle" dominant-baseline="central"
        font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="128" fill="#f9f6f2">0</text>

  <!-- "4" -->
  <rect x="56"  y="268" width="188" height="188" rx="16" fill="#f59563"/>
  <text x="150" y="362" text-anchor="middle" dominant-baseline="central"
        font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="128" fill="#f9f6f2">4</text>

  <!-- "8" -->
  <rect x="268" y="268" width="188" height="188" rx="16" fill="#edc22e"/>
  <text x="362" y="362" text-anchor="middle" dominant-baseline="central"
        font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="128" fill="#f9f6f2">8</text>
</svg>
